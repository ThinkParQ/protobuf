syntax = "proto3";
package beewatch;
option go_package = "github.com/thinkparq/protobuf/go/beewatch";

// The event message provides common header fields and wraps all event versions that can be handled
// by BeeGFS Watch. It notably does not provide a way to differentiate between minor versions of the
// API. Those should only affect the serialization format between the meta and watch services, and
// should adhere to standard protocol buffer best practices. Notably minor updates should be
// additive and not remove or change the meaning of existing fields.
message Event {
    uint64 seq_id = 1;
    uint32 meta_id = 2;
    optional uint32 meta_mirror = 3;
    // Bitmask representing event flags as defined by the EVENTFLAG constants in EventContext.h
    uint32 event_flags = 4;
    oneof event_data {
        V1Event v1 = 11;
        V2Event v2 = 12;
    }
}

// The v1 event format is the legacy format from BeeGFS v7.
message V1Event {
    Type type = 1;
    uint64 dropped_seq = 2;
    uint64 missed_seq = 3;
    string path = 4;
    string entry_id = 5;
    string parent_entry_id = 6;
    string target_path = 7;
    string target_parent_id = 8;
    
    enum Type {
        FLUSH        = 0;
        TRUNCATE     = 1;
        SETATTR      = 2;
        CLOSE_WRITE  = 3;
        CREATE       = 4;
        MKDIR        = 5;
        MKNOD        = 6;
        SYMLINK      = 7;
        RMDIR        = 8;
        UNLINK       = 9;
        HARDLINK     = 10;
        RENAME       = 11;
        READ         = 12;
    }
}

// The v2 event format was introduced in BeeGFS v8. 
message V2Event {
    Type type = 1;
    uint64 num_links = 2;
    string path = 3;
    string entry_id = 4;
    string parent_entry_id = 5;
    string target_path = 6;
    string target_parent_id = 7;
    uint32 msg_user_id = 8;
    int64 timestamp = 9;
    
    enum Type {
        INVALID            = 0;
        FLUSH              = 1;
        TRUNCATE           = 2;
        SETATTR            = 3;
        CLOSE_WRITE        = 4;
        CREATE             = 5;
        MKDIR              = 6;
        MKNOD              = 7;
        SYMLINK            = 8;
        RMDIR              = 9;
        UNLINK             = 10;
        HARDLINK           = 11;
        RENAME             = 12;
        OPEN_READ          = 13;
        OPEN_WRITE         = 14;
        OPEN_READ_WRITE    = 15;
        LAST_WRITER_CLOSED = 16;
        OPEN_BLOCKED       = 17;
        STRIPE_PATTERN_CHANGED = 18;
        INODE_LOCKED = 19;
    }
}

// EventFilter allows subscribers to restrict which events are delivered to them by specifying
// per-version allowlists of event types. It is intended as a performance optimization to avoid
// sending unwanted events over the network; it does not guarantee only events matching the filter
// will be delivered. Subscribers must always check the type of each event they receive before
// taking any action.
//
// A version field that is absent or empty means all types for that version are delivered. The
// filter as a whole being absent (no filter set in the initial Response) means all events are
// delivered regardless of type or version.
//
// Filter support is best-effort: Watch instances that predate this field will silently ignore it
// and deliver all events. If new ways of filtering events are added in the future, those will be
// silently ignored by Watch instances that do not know about them.
message EventFilter {
    // Allowlist of V1 event types the subscriber wants to receive.
    // Empty = receive all V1 event types.
    repeated V1Event.Type v1_types = 1;
    // Allowlist of V2 event types the subscriber wants to receive.
    // Empty = receive all V2 event types.
    repeated V2Event.Type v2_types = 2;
}

// Response messages allow the subscribers to acknowledge events they have processed and request a
// graceful shutdown.
message Response {
    uint64 completed_seq = 1;
    bool shutting_down = 2;
    // Optional event type filter. Only read from the first Response message the subscriber sends
    // after connecting. When absent, all events are delivered without filtering, preserving the
    // behavior of older subscribers that do not set this field. EventFilter support is best effort,
    // if Watch doesn't support event filters or a specific filter configuration, this is ignored.
    optional EventFilter filter = 3;
}

service Subscriber { 
    rpc ReceiveEvents(stream Event) returns (stream Response);
}
