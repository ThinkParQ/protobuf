syntax = "proto3";
package beeremote;
option go_package = "github.com/thinkparq/protobuf/go/beeremote";

import "flex.proto";
import "google/protobuf/timestamp.proto";

// Externally facing RPCs and messages clients and worker nodes use to interact
// with BeeRemote.
service BeeRemote {
    rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
    rpc UpdatePaths(UpdatePathsRequest) returns (stream UpdatePathsResponse);
    rpc UpdateJobs(UpdateJobsRequest) returns(UpdateJobsResponse);
    rpc GetJobs(GetJobsRequest) returns (stream GetJobsResponse);
    // Rather then BeeRemote connecting to a worker node and using a streaming RPC to return work
    // results, we have BeeRemote expose a unary RPC that is used to send results back as they are
    // available. This allows us to avoid complex error handling needed to reliably use streams, and
    // more easily adhere to our requirement that work requests are always owned by BeeRemote or its
    // worker nodes and no polling is needed to check on the state of the requests. With this
    // approach either side can make an unary request for a particular work request, and look at the
    // response to verify ownership has successfully move to the other node (i.e., the node has
    // committed the request to its on-disk database). IMPORTANT: This is only intended to be called
    // by worker nodes.
    rpc UpdateWork(UpdateWorkRequest) returns (UpdateWorkResponse);
    rpc GetRSTConfig(GetRSTConfigRequest) returns (GetRSTConfigResponse);
    rpc GetStubContents(GetStubContentsRequest) returns (GetStubContentsResponse);
    rpc GetCapabilities(flex.GetCapabilitiesRequest) returns (flex.GetCapabilitiesResponse);
    // CreateRST, UpdateRST and DeleteRST manage the remote storage targets BeeRemote serves.
    // BeeRemote applies each change at once, to itself and to every connected worker node, without
    // a restart.
    rpc CreateRST(CreateRSTRequest) returns (CreateRSTResponse);
    rpc UpdateRST(UpdateRSTRequest) returns (UpdateRSTResponse);
    rpc DeleteRST(DeleteRSTRequest) returns (DeleteRSTResponse);
    // CreateRSTBackend, UpdateRSTBackend and DeleteRSTBackend manage backends. A backend is the
    // named connection to one remote store, such as an S3 endpoint and its credentials. Targets of
    // the same type name it and inherit every value they leave unset (see
    // flex.RemoteStorageTarget.backend). Each RST type decides which settings a backend must set,
    // such as the S3 endpoint and keys, and which it must not set, such as the bucket. Every other
    // setting is optional, and is a default for the targets that name the backend. A backend is
    // not a target. It has no ID, is never sent to worker nodes as a target, and no stub or job
    // names it. A change to a backend applies at once to every target that names it.
    rpc CreateRSTBackend(CreateRSTBackendRequest) returns (CreateRSTBackendResponse);
    rpc UpdateRSTBackend(UpdateRSTBackendRequest) returns (UpdateRSTBackendResponse);
    rpc DeleteRSTBackend(DeleteRSTBackendRequest) returns (DeleteRSTBackendResponse);
    // VerifyRSTBackend checks that a backend can reach and authenticate to its store, from
    // BeeRemote and from every worker node. Unlike every other RST RPC, it contacts the store. It
    // changes nothing.
    rpc VerifyRSTBackend(VerifyRSTBackendRequest) returns (VerifyRSTBackendResponse);
    // ListRSTBuckets, CreateRSTBucket, UpdateRSTBucket and DeleteRSTBucket manage the buckets in
    // the store of a backend. BeeRemote runs each request against the store with the backend's
    // settings. These requests change the store, not BeeRemote's configuration, so nothing is
    // applied to worker nodes.
    rpc ListRSTBuckets(ListRSTBucketsRequest) returns (ListRSTBucketsResponse);
    rpc CreateRSTBucket(CreateRSTBucketRequest) returns (CreateRSTBucketResponse);
    rpc UpdateRSTBucket(UpdateRSTBucketRequest) returns (UpdateRSTBucketResponse);
    rpc DeleteRSTBucket(DeleteRSTBucketRequest) returns (DeleteRSTBucketResponse);
}

message SubmitJobRequest {
    JobRequest request = 1;
    // Set when a worker node submits the request, empty for other clients such as the CLI. Only a
    // routing hint: BeeRemote may prefer this node when assigning work requests, but may ignore it.
    string origin_node_id = 2;
}

message SubmitJobResponse {
    JobResult result = 1;
    ResponseStatus status = 2;
    enum ResponseStatus {
        INVALID = 0;
        CREATED = 1;
        EXISTING = 2;
        NOT_ALLOWED = 3;
        ALREADY_COMPLETE = 4;
        ALREADY_OFFLOADED = 5;
        FAILED_PRECONDITION = 6;
        // The request claimed a reserved job that exists but is no longer waiting to be claimed
        // because it was cancelled or already claimed. Reserving the job again would duplicate work
        // on the path.
        NOT_RESERVED = 7;
        // The request claimed a jobId that remote has no record of, so the reservation never
        // reached it or was cleaned up.
        RESERVATION_MISSING = 8;
        // An unfinished job on the same path is blocking the request. Unlike NOT_ALLOWED, the
        // blocking job is expected to finish, so the caller may submit the request again later.
        BLOCKED_BY_ACTIVE_JOB = 9;
    }
}

// A JobRequest contains all the information necessary for BeeRemote to trigger
// a job on the appropriate worker node(s) (like BeeSync nodes) based on the
// particular request_type specified by the user. It is the external request
// so it does not include automatically generated fields like the job ID or
// anything about the work request(s) used to execute the job.
message JobRequest {
    string path = 1;    
    // An arbitrary name for a job can be specified.
    // Job names are optional and not need to be unique.
    string name = 2;
    int32 priority = 3;
    // This is the uint32 ID, NOT an actual reference to an RST.
    // This ensures we don't have to include the full RST configuration,
    // every time we send a Entry (commonly as part of a Job).
    uint32 remote_storage_target = 4;
    oneof type {
        flex.SyncJob sync = 10;
        flex.MockJob mock = 11;
        flex.BuilderJob builder = 12;
    }
    // When force is set this request will create a new job even if there is already a completed
    // job. When forced the request will return an error if there is already a job running. This is
    // part of the JobRequest instead of the SubmitJobRequest message in case it ever is important
    // to know if a particular job request was forced.
    bool force = 5;
    // When stub_local is set the local file with be a stub file
    bool stub_local = 7;
    // generation_status reports the outcome of generating this JobRequest (e.g. already complete,
    // already offloaded, or an error message). This is used by job manager to determine whether the
    // job is already in a terminal or failed state.
    GenerationStatus generation_status = 8;
    message GenerationStatus {
        State state = 1;
        enum State {
            // This state has no semantic value and should never be UNSPECIFIED unless there is a bug.
            UNSPECIFIED = 0;
            // This state indicates the request has already been completed. The generation_status's
            // message field must be populated with the file's beegfs-mtime in RFC3339 format (i.e.
            // 2006-01-02T15:04:05Z07:00).
            ALREADY_COMPLETE = 1;
            // This state indicates the request has already been offloaded.
            ALREADY_OFFLOADED = 2;
            // This state indicates a preconditional failed and will always result in the job being
            // cancelled. It is imperative that this state is only used when it is safe to submit
            // the job request again without first calling rst.CompleteWorkRequests().
            FAILED_PRECONDITION = 3;
            // This state indicates an error occurred that requires rst.CompleteWorkRequests() to
            // cleanup.
            ERROR = 4;
        }
        string message = 2;
    }
    optional bool update = 9;
    // Controls the data state of the stub file when stub_local is true.
    optional flex.RestorePolicy restore_policy = 13;
    // Time in seconds to wait after a file is closed before replication begins.
    optional uint32 cooldown_secs = 14;
    // bulk_info is optionally included when the job request participates in a provider-controlled
    // bulk operation. It contains builder-maintained metadata needed to track the request within
    // that bulk operation.
    optional flex.BulkJobRequestInfo bulk_info = 15;
    // reservation says whether this request reserves a job, claims a reserved job, or neither. A
    // reservation is a placeholder job that holds the path and its RST until the reserving client
    // submits the real request, which claims it. RESERVE and CLAIM both require job_id.
    ReservationAction reservation = 16;
    enum ReservationAction {
        // A plain request. It neither reserves nor claims a job.
        NO_RESERVATION = 0;
        // Create a RESERVED job under job_id.
        RESERVE = 1;
        // Turn the RESERVED job named by job_id into this request's job.
        CLAIM = 2;
    }
    // job_id names this request's job. It must be a valid UUID. A client that may submit the same
    // request more than once, for example after a lost response, sets it so that remote can
    // recognize the repeat: a request whose job_id already names a job for the same path, RST and
    // operation gets that job and its original answer back instead of a new job. When unset,
    // remote generates the ID.
    optional string job_id = 17;
}

// Job contains all the data from the original request plus the job ID and
// current status. This is what is stored in the database for each path. We
// don't embed results of a job in the Job because we store the Job and its
// WorkResults (the latest work response from each worker node) in separate
// key/value stores. This approach simplifies encoding and decoding these
// messages and allows us to quickly look up jobs by path or ID.
message Job {
    string id = 1;
    JobRequest request = 2;
    google.protobuf.Timestamp created = 3;
    // Status is usually updated using `GetStatus()` which returns a status a pointer to the status
    // of the overall job. Because it returns a pointer the status and/or message can be updated
    // directly. This allows you to modify one but not the other field (commonly message can change
    // but status should not). The state should encompass the results for individual work requests.
    // For example if some WRs are finished and others are still running the state would be RUNNING.
    Status status = 4;
    message Status {
        State state = 1;
        // Message should be used to return any additional details, particularly to aid in
        // troubleshooting. When useful for troubleshooting, multiple historical messages may be
        // concatenated together in the format: "oldest message; newer message; newest message".
        // Especially if the request goes through multiple state transitions (for example error to
        // failed) this can be helpful to troubleshoot the chain of events that lead to a failure.
        // Note messages should not be concatenated for the entire life of a request, and should
        // generally be reset when either the state transitions from an expected to another expected
        // state (i.e., UNASSIGNED->SCHEDULED), or when a request experienced an error or failure and
        // was automatically or manually retried. Don't keep the message intact across multiple failed
        // retries as this (a) makes troubleshooting each failure difficult and (b) means the message
        // size can eventually grow beyond a reasonable limit and cause other issues.
        string message = 2;
        google.protobuf.Timestamp updated = 3;
    }
    enum State {
        // This state has no semantic value and the state should never be UNSPECIFIED unless there
        // is a bug.
        UNSPECIFIED = 0;
        // Used when the state of a job cannot be definitively determined. For example if a work
        // request is in an unknown state, or if all WRs are either in a terminal state or require
        // user intervention, but they are not all in the same state.
        UNKNOWN = 1;
        // Initially all jobs start out in the UNASSIGNED state. This indicates BeeRemote has not
        // had a chance to schedule work requests for the job to any worker node(s).
        UNASSIGNED = 2;
        // A hold is placed on this path and target by a reserve request. The job exists to prevent
        // others from taking the path until its work requests can be generated. It leaves this
        // state when the reservation is claimed or is cancelled.
        RESERVED = 11;
        // When all worker node(s) have accepted the job's work requests, but may be waiting on
        // an available worker goroutine to pickup the request.
        SCHEDULED = 3;
        // When any work requests for this job are in progress.
        RUNNING = 4;
        // TODO: https://github.com/ThinkParQ/bee-remote/issues/16
        // A user manually requested the job be paused.
        // PAUSED = 5;
        //
        // ERROR indicates one or more transient/ephemeral error(s) occurred carrying out the job,
        // but the worker nodes are still retrying the requests. Once the allowed number of retries
        // or retry timeout is exceed, the work requests will fail, and the overall job state will
        // be failed. In this state work requests are still active on the worker nodes, and jobs in
        // the error state must be cancelled or complete successfully before new jobs are allowed
        // for this RST+path combo.
        ERROR = 6;
        // FAILED indicates one or more unrecoverable errors occurred carrying out this job.
        // Typically jobs fail due to some condition that requires user intervention, such as
        // updating the RST configuration, but can also fail if work requests exceed the allowed
        // number of retries or retry timeout. Failed indicates no work requests for this job are
        // scheduled to the worker nodes (meaning it can be cancelled without talking to the
        // workers), however any associated external IDs (such as a multipart upload) have not been
        // invalidated, because (1) if we're able to resume the job later this avoids having to
        // reupload/download data and (2) it is unlikely the RST is in a state we can interact with
        // it anyway. As a result jobs in the failed state must be cancelled before new jobs are
        // allowed for this RST+path combo.
        //
        // TODO: https://github.com/ThinkParQ/bee-remote/issues/27.
        // Update the ERROR and FAILED state descriptions based on the decisions made around
        // allowing jobs to be resumed after an error/failure occurs.
        FAILED = 7;
        // Jobs and their WRs may be cancelled manually be a user. This is a terminal state and no
        // further changes are possible once a job enters this state.
        CANCELLED = 8;
        // If the job and its WRs completed successfully. This is a terminal state and no further 
        // state changes are possible once a job enters this state.
        COMPLETED = 9;
        // If the job's WRs completed successfully and a stub has replaced the local file. This is a
        // terminal state and no further state changes are possible once a job enters this state.
        OFFLOADED = 10;
    }
    // Used as the upload ID for multipart uploads, or any other time 
    // an external identifer is needed to coordinate a distributed transfer.    
    string external_id = 5;
    // start_mtime is the modification timestamp from a stat of the local file in BeeGFS captured
    // just before the job is started and any work requests are scheduled. This may be nil if there
    // is no file in BeeGFS at the start of the job. A caller might wish to compare the start/stop
    // mtime to determine if a file changed while being synchronized.
    optional google.protobuf.Timestamp start_mtime = 6;    
    // stop_mtime is the modification timestamp from a stat of the local file in BeeGFS captured
    // just before the job is completed but after all work requests have finished executing. The
    // stop_mtime is always set regardless if the job completes successfully, was aborted, or there
    // was an error completing the job. Consumers should not blindly rely on stop_mtime to determine
    // the state of a file, and should also check the job state. For example to determine if a file
    // in BeeGFS based on its current mtime matches the mtime of a successfully uploaded file. This
    // may be nil if there is no file in BeeGFS at the end of the job.
    optional google.protobuf.Timestamp stop_mtime = 7;    
    // submit_status is the answer remote gave to the request that created this job. Remote returns
    // it again when the same request is submitted again with the same job_id, so a client that
    // lost the first response gets the same answer.
    SubmitJobResponse.ResponseStatus submit_status = 8;
}

// The JobResult is used to return information about a job and its work results. Note the work
// results are not directly embedded in the Job message to reduce the amount of data that needs to
// be stored on-disk (notably work requests are deterministically generated).
message JobResult {
    Job job = 1;
    repeated flex.WorkRequest work_requests = 2;
    repeated WorkResult work_results = 3;

    message WorkResult {
        flex.Work work = 1;
        string assigned_node = 2;
        string assigned_pool = 3;
    }
}

message UpdatePathsRequest {
    string path_prefix = 1;
    UpdateJobsRequest requested_update = 2;
}

message UpdatePathsResponse {
    string path = 1;
    UpdateJobsResponse update_result = 2;
}

// UpdateJobsRequest is used to update one or more jobs for a particular path.
message UpdateJobsRequest { 
    // The path with the job(s) to update. Ignored when updating multiple paths via
    // UpdatePathsRequest.
    string path = 1;
    // Optional: Only update a single job for the specified path. If this job ID is not found for
    // the specified path, the response will be !ok.
    optional string job_id = 2;
    // Optional: Only update job(s) for the specified remote targets. When also filtering by job ID,
    // if the specified ID is not for any of these remote targets, the response will be !ok.
    map<uint32, bool> remote_targets = 3;
    // Required: The new state to set the job(s) to.
    NewState new_state = 10;
    enum NewState {
        UNSPECIFIED = 0;
        CANCELLED = 1;
        DELETED = 2;
    }

    // Optional: Normally completed jobs are ignored when making updates so some number of completed
    // jobs can be automatically retained to determine when a path has been successfully
    // synchronized with an RST. If a user wants to delete a completed job, or perhaps there was
    // some bug and the user wants to go back through the steps to cancel a job to try and
    // cleanup/recover, this can be done through a force update.
    bool force_update = 4;
    // Optional: Why the job(s) are being cancelled. It is appended to the message of each job this
    // update moves to CANCELLED, so users can see why their job ended. Ignored for other states.
    optional string reason = 5;
}

// UpdateJobsResponse returns the result of updating one or more job(s) for a particular path.
message UpdateJobsResponse {
    // Required: If the newState could not be applied to any of the jobs then ok will be false.
    // Inspect the message and individual job responses to troubleshoot further. 
    bool ok = 1;
    // Required: Generally the message will indicate any overall errors applying the update whereas
    // the status of individual jobs will indicate problems applying updates to a particular job.
    string message = 2;
    repeated JobResult results = 3;
}

// The number of query options is limited because we store jobs in a key/value
// store where the key is essentially the equivalent of an index in a
// traditional RDBMS. To optimize for multiple search terms we need to use
// multiple k/v stores using a different item we want to query for as the key.
// With the MapStore used as a wrapper around the BadgerDB k/v store we don't
// have to duplicate all information and can use the Metadata field of the
// MapStore to create references to data stored in other MapStores. 
message GetJobsRequest {
   oneof query {
    // Returns at most one Job.
    QueryIdAndPath by_job_id_and_path = 1;
    // Returns all Jobs for the specified path.
    string by_exact_path = 2;
    // Returns all Jobs for the specified paths.
    // All jobs can be returned by specifying "/".
    string by_path_prefix = 3;
   }

    message QueryIdAndPath {
        string job_id = 1;
        string path = 2;
    }
   bool include_work_requests = 4;
   // Set to true to also return work results details.
   bool include_work_results = 5;
   // By default we just return the latest results known to BeeRemote and don't
   // pull the latest work results from worker nodes and update the job status.
   // We can optionally request an update from all worker nodes for each job 
   // and also update the job status, however this inccurs extra overhead as we'll
   // have to lock the entries and send extra messages to get the latest status.
   // Generally this should only be used to get the latest updates from a single 
   // job or all jobs for a particular path. 
   bool update_work_results = 6;
}

message GetJobsResponse {
    string path = 1;
    repeated JobResult results = 2;
}

message UpdateWorkRequest {
    flex.Work work = 1;
}

message UpdateWorkResponse {
    // We use our own empty message instead of google.protobuf.Empty to ensure backwards
    // compatibility should we need to add fields in the future.
}

message GetRSTConfigRequest {
    // Also return the remote storage targets that were deleted. They are returned in deleted, never
    // in rsts, and without their configuration.
    bool include_deleted = 1;
    // Also return every backend, and every target as stored, with only the values it sets itself.
    bool include_definitions = 2;
}

message GetRSTConfigResponse {
    // The effective configuration of every target: the values it inherits from its backend are
    // filled in.
    repeated flex.RemoteStorageTarget rsts = 1;
    // Set only when include_deleted was requested.
    repeated DeletedRST deleted = 2;
    // Set only when include_definitions was requested. Every backend as stored.
    repeated flex.RemoteStorageTarget backends = 3;
    // Set only when include_definitions was requested. Every target as stored, with only the values
    // it sets itself. A client that changes a target sends this form, not the effective one, or it
    // would copy the inherited values into the target.
    repeated flex.RemoteStorageTarget definitions = 4;
}

// DeletedRST describes a remote storage target that was deleted. BeeRemote keeps a record of every
// deleted target, because stubs and file metadata may still name its ID. The ID is never given to
// another target, and a request that names it is refused with the reason recorded here.
message DeletedRST {
    uint32 id = 1;
    string name = 2;
    // The RST type, for example "s3" or "xtreemstore".
    string type = 3;
    // The reason given when the target was deleted. It may be empty.
    string reason = 4;
    google.protobuf.Timestamp deleted_at = 5;
}

message CreateRSTRequest {
    // Required: The configuration of the new target. When rst.id is 0, BeeRemote assigns the next
    // ID that was never used, counting deleted targets.
    flex.RemoteStorageTarget rst = 1;
    // Optional: Allow rst.id to be the ID of a deleted target. Without it, BeeRemote refuses that
    // ID, because stubs, file metadata and jobs may still name it and would then refer to the new
    // target. With it, the new target replaces the delete record.
    bool force = 2;
}

message CreateRSTResponse {
    // The target as BeeRemote stored it, including the assigned ID.
    flex.RemoteStorageTarget rst = 1;
    ApplyResult apply = 2;
    // The number of unfinished jobs of the deleted target whose ID was reused. They are no longer
    // cancelled, and continue on the new target. Zero unless force reused an ID.
    int64 reused_unfinished_jobs = 3;
    // The target with the values it inherits from its backend filled in. Equal to rst for a target
    // without a backend.
    flex.RemoteStorageTarget effective = 4;
}

message UpdateRSTRequest {
    // Required: The full new configuration of the target that rst.id names, as stored: only the
    // values the target sets itself (see GetRSTConfigResponse.definitions). The type cannot change.
    flex.RemoteStorageTarget rst = 1;
    // Required: The stored configuration the caller read before it made its change. BeeRemote refuses the
    // update with ABORTED when the stored configuration no longer equals this, because someone else
    // changed the target in between. The caller reads the target again and retries.
    flex.RemoteStorageTarget expected = 2;
    // Optional: Apply a change to the target's endpoint, bucket, region or partition even while
    // unfinished jobs use the target. Without it such a change is refused with FAILED_PRECONDITION,
    // because those jobs may refer to remote paths that the change moves somewhere else.
    bool force = 3;
}

message UpdateRSTResponse {
    ApplyResult apply = 1;
    // The target with the values it inherits from its backend filled in.
    flex.RemoteStorageTarget effective = 2;
}

message DeleteRSTRequest {
    // Required: The ID of the target to delete.
    uint32 id = 1;
    // Optional: Why the target is deleted. BeeRemote records it, appends it to the message of every
    // job it cancels because of the delete, and returns it when a new request names the target.
    optional string reason = 2;
    // Optional: Only count the target's unfinished jobs, and change nothing.
    bool dry_run = 3;
}

message DeleteRSTResponse {
    // The number of unfinished jobs that use the target. BeeRemote does not cancel them during the
    // delete. Each one is cancelled the next time BeeRemote or a worker node would use the target
    // for it.
    int64 unfinished_jobs = 1;
    // Not set for a dry run.
    ApplyResult apply = 2;
}

message CreateRSTBackendRequest {
    // Required: The new backend. Its name is required and must not belong to another backend. Its
    // id must be 0. It must not name a backend: a target names a backend, a backend names none. It
    // must set every setting its type requires of a backend, and none its type forbids.
    flex.RemoteStorageTarget backend = 1;
    // Optional: Before storing the backend, check from BeeRemote that it reaches its store, as
    // VerifyRSTBackend does for BeeRemote's own host. BeeRemote refuses the create with
    // FAILED_PRECONDITION when the check fails, and stores nothing. Worker nodes are not checked.
    // Use VerifyRSTBackend for them.
    bool verify = 2;
}

message CreateRSTBackendResponse {
    // The backend as BeeRemote stored it. A new backend has no targets, so nothing is applied.
    flex.RemoteStorageTarget backend = 1;
    // Set only when verify was requested: a note about the check, such as keys that may not list
    // buckets. Empty when the check passed with nothing to note.
    string verify_note = 2;
}

message UpdateRSTBackendRequest {
    // Required: The current name of the backend to update.
    string name = 1;
    // Required: The full new configuration of the backend. A new name renames the backend, and
    // BeeRemote changes every target that names it in the same update. The type cannot change. The
    // rules of CreateRSTBackendRequest.backend apply.
    flex.RemoteStorageTarget backend = 2;
    // Required: The configuration the caller read before it made its change. BeeRemote refuses the
    // update with ABORTED when the stored configuration no longer equals this.
    flex.RemoteStorageTarget expected = 3;
    // Optional: Apply the change even when it moves where a target that names the backend keeps
    // its objects while unfinished jobs use that target. See UpdateRSTRequest.force.
    bool force = 4;
    // Optional: Before storing the new configuration, check from BeeRemote that it reaches its
    // store. See CreateRSTBackendRequest.verify.
    bool verify = 5;
}

message UpdateRSTBackendResponse {
    ApplyResult apply = 1;
    // The IDs of the targets whose effective configuration the update changed.
    repeated uint32 affected_targets = 2;
    // See CreateRSTBackendResponse.verify_note.
    string verify_note = 3;
}

message DeleteRSTBackendRequest {
    // Required: The name of the backend to delete. BeeRemote refuses the delete with
    // FAILED_PRECONDITION while any target names the backend, and the message lists those targets.
    // So a delete never changes a target.
    string name = 1;
}

// DeleteRSTBackendResponse is empty. A delete never changes a target, so there is nothing to apply
// to the worker nodes.
message DeleteRSTBackendResponse {}

message VerifyRSTBackendRequest {
    // Required: The name of the stored backend to verify. To check a backend before it is stored,
    // use the verify field of CreateRSTBackendRequest or UpdateRSTBackendRequest.
    string name = 1;
    // Was a backend that is not stored. Create and update now verify their own definition.
    reserved 2;
    // Optional: How long each host may take, in milliseconds. 0 means BeeRemote's default.
    uint32 timeout_ms = 3;
}

message VerifyRSTBackendResponse {
    // One result for BeeRemote, then one for each worker node.
    repeated HostResult hosts = 1;

    message HostResult {
        // "remote" for BeeRemote, or the ID of a worker node.
        string host = 1;
        Outcome outcome = 2;
        // Why the check failed, or a note about a check that passed.
        string message = 3;
    }

    enum Outcome {
        UNSPECIFIED = 0;
        // The host reached the store, and the store accepted the backend's credentials.
        OK = 1;
        // The host could not reach the store, or the store rejected the credentials.
        FAILED = 2;
        // The worker node is not connected, so it was not asked.
        OFFLINE = 3;
        // The worker node is too old to verify a backend.
        UNSUPPORTED = 4;
    }
}

// RSTBucket is one bucket in the store of a backend.
message RSTBucket {
    string name = 1;
    // When the store created the bucket. Not set when the store does not report it.
    google.protobuf.Timestamp created = 2;
    // Whether the bucket keeps old versions of objects. UNKNOWN when it was not read, such as in a
    // list without details.
    Versioning versioning = 3;
    // The bucket's tags. Empty when it has none, or when they were not read.
    map<string, string> tags = 4;
    // True when versioning and tags were read.
    bool details = 5;
    // The IDs of the live targets whose effective configuration uses this bucket.
    repeated uint32 targets = 6;

    enum Versioning {
        UNKNOWN = 0;
        // Versioning was never enabled.
        UNVERSIONED = 1;
        ENABLED = 2;
        // Versioning was enabled once and is now suspended. Old versions are kept.
        SUSPENDED = 3;
    }
}

message ListRSTBucketsRequest {
    // Optional: The backend whose buckets to list. Empty lists the buckets of every backend whose
    // type can manage buckets.
    string backend = 1;
    // Optional: Also read each bucket's versioning and tags. This costs extra requests per bucket.
    bool details = 2;
}

message ListRSTBucketsResponse {
    // One entry per backend, sorted by name.
    repeated BackendBuckets backends = 1;

    message BackendBuckets {
        string backend = 1;
        // Sorted by name.
        repeated RSTBucket buckets = 2;
        // Why the buckets of this backend could not be listed. One backend that fails does not
        // fail the request.
        string error = 3;
    }
}

message CreateRSTBucketRequest {
    // Required: The backend whose store gets the bucket. The bucket is created in the backend's
    // region.
    string backend = 1;
    // Required: The name of the new bucket. The store checks the name.
    string name = 2;
    // Optional: ENABLED or SUSPENDED sets the bucket's versioning after it is created. UNKNOWN
    // leaves the store's default.
    RSTBucket.Versioning versioning = 3;
    // Optional: Tags to set on the new bucket.
    map<string, string> tags = 4;
}

message CreateRSTBucketResponse {
    // The new bucket, with its details.
    RSTBucket bucket = 1;
}

message UpdateRSTBucketRequest {
    // Required: The backend whose store holds the bucket.
    string backend = 1;
    // Required: The bucket to change.
    string name = 2;
    // Optional: ENABLED or SUSPENDED changes the bucket's versioning. UNKNOWN leaves it.
    // UNVERSIONED is refused, because a store cannot turn versioning off once it was enabled.
    RSTBucket.Versioning versioning = 3;
    // Optional: Tags to add, or to change the value of.
    map<string, string> set_tags = 4;
    // Optional: Keys of the tags to remove. A key that is not set is ignored.
    repeated string remove_tags = 5;
    // Optional: Remove every tag before set_tags is applied.
    bool clear_tags = 6;
}

message UpdateRSTBucketResponse {
    // The bucket after the change, with its details.
    RSTBucket bucket = 1;
}

message DeleteRSTBucketRequest {
    // Required: The backend whose store holds the bucket.
    string backend = 1;
    // Required: The bucket to delete.
    string name = 2;
    // Optional: Delete a bucket that holds objects. BeeRemote first deletes every object, every old
    // version of an object, and every unfinished multipart upload. Without force, a bucket that
    // holds any of them is refused with FAILED_PRECONDITION. A bucket a live target uses is
    // refused with FAILED_PRECONDITION, with or without force.
    bool force = 3;
}

message DeleteRSTBucketResponse {
    // The number of objects and object versions deleted to empty the bucket.
    int64 deleted_objects = 1;
    // The number of unfinished multipart uploads aborted to empty the bucket.
    int64 aborted_uploads = 2;
}

// ApplyResult reports how a change to the remote storage targets reached the worker nodes.
message ApplyResult {
    repeated NodeResult nodes = 1;

    message NodeResult {
        string node_id = 1;
        Outcome outcome = 2;
        // Why the node rejected the change, or any other detail about the outcome.
        string message = 3;
    }

    enum Outcome {
        UNSPECIFIED = 0;
        // The node applied the change.
        APPLIED = 1;
        // The node refused the change. BeeRemote assigns it no new work and keeps retrying with the
        // current configuration until the node accepts it.
        REJECTED = 2;
        // The node is not connected. It receives the current configuration when it reconnects.
        OFFLINE = 3;
    }
}

message GetStubContentsRequest {
    string path = 1;
}

message GetStubContentsResponse {
    optional uint32 rst_id = 1;
    optional string url = 2;
}
